name: stock-pipeline

on:
  # Triggered hourly (07:00-23:00 IST) by cron-job.org via the
  # workflow_dispatch API — GitHub's own schedule trigger lags and drops runs.
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

concurrency:
  group: stock-pipeline

jobs:
  run:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Kolkata
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python run_pipeline.py
      - name: Email alert via GitHub issue
        if: ${{ hashFiles('ALERT.md') != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TITLE=$(head -n 1 ALERT.md | sed 's/^# *//')
          gh issue create \
            --title "$TITLE" \
            --body-file ALERT.md \
            --assignee maverick14303
          rm ALERT.md
      - name: Commit results back
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add news.db digests portfolio.json bot_portfolio.json
          git commit -m "pipeline run $(date +'%Y-%m-%d %H:%M %Z')" || echo "nothing new"
          git push
