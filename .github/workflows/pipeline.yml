name: stock-pipeline

on:
  # Triggered by cron-job.org via the workflow_dispatch API — GitHub's own
  # schedule trigger lags 5-15 min and occasionally drops runs.
  #
  # Schedule (IST, weekdays) — 10 runs, down from hourly 07:00-23:00:
  #   08:15  pre-open sweep. THE important one: overnight Indian announcements
  #          plus the US close land here, and nobody in India can trade them
  #          until 09:15, so it is the only window where news may not be priced
  #          in yet (see ROADMAP_ML.md §5).
  #   09:30-14:30 hourly (6 runs)  NSE session
  #   15:45  post-close sweep — must land BEFORE trading-bot's 16:15 run, which
  #          reads news_signal.json from this repo's raw URL.
  #   20:00  US open   (19:00 IST in US summer time, 20:00 in winter — this
  #   02:30  US close   time lands after the event in BOTH, so no DST edits)
  # Weekends: 10:00 and 20:00 only.
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

concurrency:
  group: stock-pipeline

jobs:
  run:
    runs-on: ubuntu-latest
    # API keys are deliberately NOT job-scoped. At job scope they sit in the
    # environment of every step, including `pip install`, which runs arbitrary
    # setup code from ~30 packages. llm_analyst.py is the only consumer, so they
    # are scoped to the one step that invokes it. TZ is safe at job scope (and
    # newslib.parse_feed_time is timezone-independent by design — L11).
    env:
      TZ: Asia/Kolkata
      # The release that holds news.db. One rolling asset plus dated weekly
      # snapshots; see the "Publish the database" step.
      DB_TAG: data
      SNAPSHOT_KEEP: "12"

    steps:
      # Actions are pinned to commit SHAs, not tags. A tag is mutable: whoever
      # can move `v4` can run their own code inside this job, which holds a
      # `contents: write` token and pushes to main. The SHAs below are exactly
      # what v4 / v5 resolved to on 2026-07-31, so this changed no behaviour.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
      # -c pins the full transitive closure; see requirements.lock.txt.
      - run: pip install -r requirements.txt -c requirements.lock.txt

      # news.db lives as a RELEASE ASSET, not in git. It outgrew GitHub's 100 MiB
      # per-file push limit (88.7 MiB on 2026-09-10, +1.6 MiB/day), and once a push
      # is rejected EVERY committed artifact stops updating, silently, forever —
      # the pipeline keeps running and keeps looking healthy. Release assets are
      # capped at 2 GB instead, which is ~3 years at this rate.
      #
      # Git LFS was considered and rejected: it stores every version whole with no
      # delta compression, so at ~10 commits/day it would consume ~887 MiB/day and
      # exhaust the 10 GB free quota in ~11 days. Git's own delta compression is
      # doing this well (933 versions pack into 257 MiB); LFS would switch it off.
      - name: Fetch the database
        id: fetch_db
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download "$DB_TAG" --pattern news.db --clobber || {
            echo "::error::could not download news.db from release '$DB_TAG'."
            echo "::error::REFUSING to continue: running now would create an empty"
            echo "::error::database and the upload step would overwrite the real one."
            exit 1
          }
          python - <<'PY'
          # A truncated or half-downloaded file is worse than no file, because the
          # upload at the end would replace ~160k real rows with it. Verify BEFORE
          # anything writes: the file must open, carry the expected tables, and
          # hold a plausible number of rows.
          import sqlite3, sys, os
          MIN_ROWS = 50_000          # articles alone was 68,963 on 2026-09-10
          NEED = {"articles", "article_tickers", "labels", "graded"}
          size = os.path.getsize("news.db")
          con = sqlite3.connect("news.db")
          have = {r[0] for r in con.execute(
              "select name from sqlite_master where type='table'")}
          missing = NEED - have
          if missing:
              sys.exit(f"downloaded news.db is missing tables: {sorted(missing)}")
          n = con.execute("select count(*) from articles").fetchone()[0]
          if n < MIN_ROWS:
              sys.exit(f"downloaded news.db has only {n} articles, expected "
                       f">= {MIN_ROWS}. Refusing to run on a truncated database.")
          print(f"database OK: {size/1048576:.1f} MiB, {n:,} articles")
          PY

      - name: Run pipeline
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python run_pipeline.py
      - name: Email alert via GitHub issue
        if: ${{ hashFiles('ALERT.md') != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TITLE=$(head -n 1 ALERT.md | sed 's/^# *//')
          gh issue create \
            --title "$TITLE" \
            --body-file ALERT.md \
            --assignee maverick14303
          rm ALERT.md
      # Open an issue (GitHub emails it) when any pipeline step exits non-zero.
      # cron-job.org only knows whether GitHub ACCEPTED the trigger — it cannot
      # see whether the pipeline worked, so this is the only real health signal.
      - name: Report pipeline failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --title "🚨 Pipeline FAILED — $(date +'%Y-%m-%d %H:%M %Z')" \
            --body "A step in run_pipeline.py exited non-zero. Digest for this run is committed; step output is under the failing heading.

          Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --assignee maverick14303

      # always(), and BEFORE the commit step, for the same reason the commit step
      # uses always(): whatever this run scraped exists only on a runner that is
      # about to be destroyed. A pipeline step failing part-way through does not
      # make the rows it already wrote worthless.
      #
      # This step is skipped when the fetch failed, because `news.db` would then
      # be absent or unverified — and uploading it would destroy the real one.
      - name: Publish the database
        if: always() && steps.fetch_db.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ ! -f news.db ]; then
            echo "::error::news.db is gone after the run — not uploading."
            exit 1
          fi
          # Same verification as the fetch. A run that corrupted the database must
          # not be allowed to publish it over the last good copy.
          python - <<'PY'
          import sqlite3, sys
          con = sqlite3.connect("news.db")
          n = con.execute("select count(*) from articles").fetchone()[0]
          if n < 50_000:
              sys.exit(f"news.db has only {n} articles after the run — refusing "
                       "to publish over the last good copy.")
          print(f"publishing {n:,} articles")
          PY

          # The rolling copy the next run will fetch.
          for attempt in 1 2 3; do
            if gh release upload "$DB_TAG" news.db --clobber; then
              echo "uploaded on attempt $attempt"
              break
            fi
            if [ "$attempt" = 3 ]; then
              echo "::error::could not publish news.db after 3 attempts. THIS RUN'S"
              echo "::error::SCRAPED NEWS IS LOST — the runner is about to be destroyed."
              exit 1
            fi
            sleep $((attempt * 10))
          done

          # A dated weekly snapshot, so a corrupted database can be rewound. The
          # rolling asset above is overwritten every run and keeps no history at
          # all, which is the one thing leaving git costs us.
          #
          # The asset list is fetched ONCE into a variable rather than piped twice.
          # Under `set -o pipefail`, `gh ... | grep -q` can report 141 (SIGPIPE,
          # because -q exits early and closes the pipe) instead of the grep result,
          # which would make the snapshot check say the wrong thing.
          ASSETS="$(gh release view "$DB_TAG" --json assets -q '.assets[].name')"
          SNAP="news-$(date -u +'%G-W%V').db"

          if grep -qxF "$SNAP" <<<"$ASSETS"; then
            echo "weekly snapshot $SNAP already exists"
          else
            cp news.db "$SNAP"
            if gh release upload "$DB_TAG" "$SNAP"; then
              echo "weekly snapshot $SNAP uploaded"
              ASSETS="$ASSETS"$'\n'"$SNAP"
            else
              echo "::warning::weekly snapshot $SNAP failed to upload"
            fi
            rm -f "$SNAP"
          fi

          # Keep the newest SNAPSHOT_KEEP weeklies (~1.8 GiB at 12). ISO week names
          # sort lexically in date order, so `sort -r | tail -n +N` is "everything
          # older than the newest N". `|| true` because grep exits 1 when there is
          # nothing to prune, which is the normal case for the first 12 weeks.
          OLD_SNAPS="$(grep -E '^news-[0-9]{4}-W[0-9]{2}\.db$' <<<"$ASSETS" \
            | sort -r | tail -n +$((SNAPSHOT_KEEP + 1)) || true)"
          while IFS= read -r a; do
            [ -n "$a" ] || continue
            echo "pruning old snapshot $a"
            gh release delete-asset "$DB_TAG" "$a" --yes || \
              echo "::warning::could not prune $a"
          done <<<"$OLD_SNAPS"

      # always(): a failed run must still commit its digest — that digest is the
      # evidence needed to diagnose the failure.
      - name: Commit results back
        if: always()
        run: |
          # Authored as Ankit so pipeline runs count as contributions. GitHub
          # credits a commit to an account only when the author email belongs
          # to it; "github-actions[bot]@..." belonged to nobody, so all ~10
          # runs a day were credited to no one. The noreply form keeps the real
          # address private.
          set -u
          git config user.name "maverick14303"
          git config user.email "146925473+maverick14303@users.noreply.github.com"
          # news.db is deliberately absent: it is a release asset now, published
          # by the step above. See the "Fetch the database" comment.
          git add digests bot_portfolio.json news_signal.json tickers.csv
          if ! git commit -m "pipeline run $(date +'%Y-%m-%d %H:%M %Z')"; then
            echo "nothing new"
            exit 0
          fi
          # A bare `git push` is one shot. `concurrency` serialises this workflow
          # against itself, so runner-vs-runner cannot collide — but any human
          # push to main between checkout and here makes this non-fast-forward,
          # the step fails, and EVERYTHING the run scraped exists only on the
          # runner that is about to be destroyed. The feeds carry 35-60 items and
          # are polled every 1-6 hours, so items that scroll off before the next
          # successful run are gone permanently. Rebase and retry instead.
          for attempt in 1 2 3; do
            if git push; then
              echo "pushed on attempt $attempt"
              exit 0
            fi
            echo "push attempt $attempt failed; rebasing onto origin/main"
            if ! git pull --rebase --autostash origin main; then
              # Deliberately NOT resolved automatically. Since news.db left git
              # this can no longer be a binary-database conflict, but a conflict
              # on the digests or the signal file still means something
              # unexpected touched main; picking a side would silently discard
              # one of them. Go red and let a human look.
              git rebase --abort || true
              echo "::error::rebase onto origin/main conflicted - refusing to resolve it automatically. Reconcile main by hand, then re-run."
              exit 1
            fi
            sleep $((attempt * 5))
          done
          echo "::error::push failed after 3 attempts"
          exit 1
