name: stock-pipeline

on:
  # Triggered by cron-job.org via the workflow_dispatch API — GitHub's own
  # schedule trigger lags 5-15 min and occasionally drops runs.
  #
  # Schedule (IST, weekdays) — 10 runs, down from hourly 07:00-23:00:
  #   08:15  pre-open sweep. THE important one: overnight Indian announcements
  #          plus the US close land here, and nobody in India can trade them
  #          until 09:15, so it is the only window where news may not be priced
  #          in yet (see ROADMAP_ML.md §5).
  #   09:30-14:30 hourly (6 runs)  NSE session
  #   15:45  post-close sweep — must land BEFORE trading-bot's 16:15 run, which
  #          reads news_signal.json from this repo's raw URL.
  #   20:00  US open   (19:00 IST in US summer time, 20:00 in winter — this
  #   02:30  US close   time lands after the event in BOTH, so no DST edits)
  # Weekends: 10:00 and 20:00 only.
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

concurrency:
  group: stock-pipeline

jobs:
  run:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Kolkata
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python run_pipeline.py
      - name: Email alert via GitHub issue
        if: ${{ hashFiles('ALERT.md') != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TITLE=$(head -n 1 ALERT.md | sed 's/^# *//')
          gh issue create \
            --title "$TITLE" \
            --body-file ALERT.md \
            --assignee maverick14303
          rm ALERT.md
      # Open an issue (GitHub emails it) when any pipeline step exits non-zero.
      # cron-job.org only knows whether GitHub ACCEPTED the trigger — it cannot
      # see whether the pipeline worked, so this is the only real health signal.
      - name: Report pipeline failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --title "🚨 Pipeline FAILED — $(date +'%Y-%m-%d %H:%M %Z')" \
            --body "A step in run_pipeline.py exited non-zero. Digest for this run is committed; step output is under the failing heading.

          Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --assignee maverick14303

      # always(): a failed run must still commit its digest — that digest is the
      # evidence needed to diagnose the failure.
      - name: Commit results back
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add news.db digests bot_portfolio.json news_signal.json tickers.csv
          git commit -m "pipeline run $(date +'%Y-%m-%d %H:%M %Z')" || echo "nothing new"
          git push
