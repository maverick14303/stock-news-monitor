name: stock-pipeline

on:
  schedule:
    # every 2 hours, 07:00-23:00 IST (01:30-17:30 UTC)
    - cron: "30 1-17/2 * * *"
  workflow_dispatch: {}     # manual run button

permissions:
  contents: write
  issues: write

jobs:
  run:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Kolkata
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python run_pipeline.py
      - name: Email alert via GitHub issue
        if: ${{ hashFiles('ALERT.md') != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --title "Stock alert — $(date +'%d %b %H:%M IST')" \
            --body-file ALERT.md \
            --assignee maverick14303
          rm ALERT.md
      - name: Commit results back
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add news.db digests portfolio.json
          git commit -m "pipeline run $(date +'%Y-%m-%d %H:%M %Z')" || echo "nothing new"
          git push
